<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">HINO V-Belt System Schematic</title>
  <desc id="desc">Schematic reference of a truck V-belt system showing crank pulley, alternator, water pump, air compressor, idle pulley, and belt tension point.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#101010" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.45" stop-color="#c7cbd1"/>
      <stop offset="1" stop-color="#8f969e"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#cf102d"/>
    </marker>
  </defs>

  <rect width="1400" height="850" fill="#f7f7f5"/>
  <rect x="58" y="54" width="1284" height="742" rx="26" fill="#ffffff" stroke="#e5e7eb"/>

  <g transform="translate(95 82)">
    <text x="0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#111827">Assembly ระบบสายพานหน้าเครื่อง</text>
    <text x="0" y="70" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b7280">Schematic อ้างอิงระบบ V-Belt รถบรรทุก HINO - ใช้อธิบายองค์ประกอบ ไม่ใช่ตำแหน่งเฉพาะรุ่น</text>
  </g>

  <g transform="translate(0 10)" filter="url(#shadow)">
    <rect x="520" y="178" width="360" height="520" rx="30" fill="url(#metal)" stroke="#71717a" stroke-width="5"/>
    <rect x="566" y="220" width="268" height="70" rx="18" fill="#d8dbe0" stroke="#9ca3af" stroke-width="4"/>
    <rect x="586" y="618" width="228" height="74" rx="14" fill="#374151"/>
    <circle cx="700" cy="426" r="112" fill="#d7dbe1" stroke="#6b7280" stroke-width="6"/>
    <circle cx="700" cy="426" r="86" fill="#c4c9d0" stroke="#71717a" stroke-width="4"/>
    <g fill="#9ca3af">
      <circle cx="700" cy="334" r="8"/>
      <circle cx="788" cy="398" r="8"/>
      <circle cx="754" cy="506" r="8"/>
      <circle cx="646" cy="506" r="8"/>
      <circle cx="612" cy="398" r="8"/>
    </g>
  </g>

  <g id="pulleys" filter="url(#shadow)">
    <circle cx="700" cy="634" r="128" fill="url(#darkMetal)" stroke="#09090b" stroke-width="8"/>
    <circle cx="700" cy="634" r="84" fill="#222831" stroke="#52525b" stroke-width="6"/>
    <circle cx="700" cy="634" r="28" fill="#e5e7eb" stroke="#6b7280" stroke-width="5"/>

    <circle cx="365" cy="324" r="88" fill="url(#metal)" stroke="#71717a" stroke-width="7"/>
    <circle cx="365" cy="324" r="56" fill="#111827" stroke="#52525b" stroke-width="5"/>
    <circle cx="365" cy="324" r="20" fill="#e5e7eb" stroke="#6b7280" stroke-width="4"/>

    <circle cx="690" cy="286" r="82" fill="url(#metal)" stroke="#71717a" stroke-width="7"/>
    <circle cx="690" cy="286" r="54" fill="#111827" stroke="#52525b" stroke-width="5"/>
    <circle cx="690" cy="286" r="18" fill="#e5e7eb" stroke="#6b7280" stroke-width="4"/>

    <circle cx="1018" cy="454" r="94" fill="url(#metal)" stroke="#71717a" stroke-width="7"/>
    <circle cx="1018" cy="454" r="61" fill="#111827" stroke="#52525b" stroke-width="5"/>
    <circle cx="1018" cy="454" r="20" fill="#e5e7eb" stroke="#6b7280" stroke-width="4"/>

    <circle cx="482" cy="536" r="62" fill="url(#darkMetal)" stroke="#09090b" stroke-width="7"/>
    <circle cx="482" cy="536" r="36" fill="#d1d5db" stroke="#6b7280" stroke-width="4"/>

    <circle cx="936" cy="258" r="58" fill="url(#darkMetal)" stroke="#09090b" stroke-width="7"/>
    <circle cx="936" cy="258" r="34" fill="#d1d5db" stroke="#6b7280" stroke-width="4"/>
  </g>

  <g id="belt" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 762 C590 754 510 650 482 598" stroke="#050505" stroke-width="34"/>
    <path d="M482 474 C452 420 406 384 365 412" stroke="#050505" stroke-width="34"/>
    <path d="M284 291 C346 216 538 197 690 204" stroke="#050505" stroke-width="34"/>
    <path d="M754 232 C820 222 890 226 936 200" stroke="#050505" stroke-width="34"/>
    <path d="M990 246 C1062 304 1112 392 1087 454" stroke="#050505" stroke-width="34"/>
    <path d="M987 507 C894 610 804 699 700 762" stroke="#050505" stroke-width="34"/>

    <path d="M700 762 C590 754 510 650 482 598" stroke="#2f3338" stroke-width="18"/>
    <path d="M482 474 C452 420 406 384 365 412" stroke="#2f3338" stroke-width="18"/>
    <path d="M284 291 C346 216 538 197 690 204" stroke="#2f3338" stroke-width="18"/>
    <path d="M754 232 C820 222 890 226 936 200" stroke="#2f3338" stroke-width="18"/>
    <path d="M990 246 C1062 304 1112 392 1087 454" stroke="#2f3338" stroke-width="18"/>
    <path d="M987 507 C894 610 804 699 700 762" stroke="#2f3338" stroke-width="18"/>
  </g>

  <g id="direction" fill="none" stroke="#cf102d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M573 718 C535 690 510 650 492 612"/>
    <path d="M347 230 C432 206 526 198 616 202"/>
    <path d="M801 225 C854 222 897 216 922 203"/>
    <path d="M1068 337 C1091 381 1097 423 1087 454"/>
    <path d="M909 589 C857 641 803 690 738 730"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#ffffff" stroke="#d1d5db" stroke-width="2">
      <rect x="222" y="204" width="210" height="52" rx="26"/>
      <rect x="590" y="130" width="202" height="52" rx="26"/>
      <rect x="933" y="582" width="236" height="52" rx="26"/>
      <rect x="590" y="760" width="228" height="52" rx="26"/>
      <rect x="303" y="584" width="236" height="52" rx="26"/>
      <rect x="880" y="132" width="210" height="52" rx="26"/>
    </g>
    <g fill="#111827" font-size="22" font-weight="700" text-anchor="middle">
      <text x="327" y="238">Alternator</text>
      <text x="691" y="164">Water Pump / Fan</text>
      <text x="1051" y="616">A/C Compressor</text>
      <text x="704" y="794">Crank Pulley</text>
      <text x="421" y="618">Idle Pulley</text>
      <text x="985" y="166">Tension Adjuster</text>
    </g>
  </g>

  <g transform="translate(95 742)">
    <rect x="0" y="0" width="1210" height="44" rx="12" fill="#fff5f5" stroke="#fecdd3"/>
    <text x="22" y="29" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#9f1239">หมายเหตุ:</text>
    <text x="112" y="29" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#374151">ภาพนี้ใช้สื่อสารองค์ประกอบของระบบสายพาน ไม่ใช่ routing เฉพาะรุ่นหรือคู่มือซ่อมทางการ</text>
  </g>
</svg>
